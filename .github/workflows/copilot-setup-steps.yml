name: Copilot Setup Steps

# Recommended environment setup for Copilot coding agent runs in this repo.
# Keeps Node + npm dependencies warm so agent runs start quickly.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate build
        run: npm run build
