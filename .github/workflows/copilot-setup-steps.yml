name: Copilot Setup Steps

# Recommended environment setup for Copilot coding agent runs in this repo.
# The site is built with Hugo (extended) and the ms-hugo-theme remote template,
# vendored as a git submodule. There is no Node/npm toolchain.

on:
  workflow_dispatch:

env:
  HUGO_VERSION: 0.165.0
  DART_SASS_VERSION: 1.83.4

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Install Dart Sass
        run: |
          set -euo pipefail
          curl -sSL -o dart-sass.tar.gz \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Validate build
        run: |
          set -euo pipefail
          hugo --minify --gc 2>&1 | tee build.log
          if grep -qE '^ERROR' build.log; then
            grep -E '^ERROR' build.log
            exit 1
          fi
          bash .github/scripts/check-links.sh
