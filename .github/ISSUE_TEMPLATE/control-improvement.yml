name: Control improvement
description: Improve evidence guidance, checklist, or wording for an audit control
title: "[control] <module>.<section>.<item> – <short description>"
labels: ["innersource", "audit-evidence"]
body:
  - type: input
    id: control
    attributes:
      label: Control reference
      description: e.g. A.2.1, B.1.1
      placeholder: "B.1.1"
    validations:
      required: true
  - type: dropdown
    id: change-type
    attributes:
      label: Change type
      options:
        - Add evidence item
        - Remove evidence item
        - Reword existing guidance
        - Add common gap
        - Other
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this change?
      description: What did you observe in the field that motivates this? Anonymise customer detail.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed wording / item
      description: Paste the new text or checklist item.
  - type: checkboxes
    id: sync
    attributes:
      label: Sync reminders
      options:
        - label: I will also update `.github/scripts/create-issues.sh` if a checklist item changes
        - label: I will also update `public/templates/audit/evidence-tracker.xlsx` if controls change
